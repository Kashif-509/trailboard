name: Performance budget

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  bundle-size:
    name: Bundle size (size-limit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Fails the job if the gzipped JavaScript goes over the limits in .size-limit.json
      - run: npx size-limit

  lighthouse:
    name: Lighthouse CI (3 runs, median)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Starts `vite preview`, runs Lighthouse 3 times and checks the assertions in lighthouserc.json
      - run: npx @lhci/cli autorun
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-reports
          path: .lighthouseci
